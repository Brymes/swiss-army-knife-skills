name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          enable-cache: true

      - name: Sync
        run: uv sync --dev

      - name: Tests
        run: uv run pytest -q

      - name: Catalog
        run: uv run sak catalog validate

      - name: CLI smoke
        run: |
          uv run sak --version
          uv run sak catalog list --kind suite
