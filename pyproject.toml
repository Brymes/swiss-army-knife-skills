[project]
name = "sak"
version = "0.1.0"
description = "Portable, ranked security-tool and prompt suite for authorized assessments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "sak contributors" }]
keywords = ["security", "prompt", "catalog", "assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23",
]

[project.scripts]
sak = "sak.__main__:main"

[project.urls]
Homepage = "https://github.com/Brymes/swiss-army-knife-skills"
Repository = "https://github.com/Brymes/swiss-army-knife-skills"
Issues = "https://github.com/Brymes/swiss-army-knife-skills/issues"
Changelog = "https://github.com/Brymes/swiss-army-knife-skills/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Brymes/swiss-army-knife-skills/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sak"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "sak/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
