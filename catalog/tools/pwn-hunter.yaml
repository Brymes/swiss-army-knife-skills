notes: |
  invoke.type: skill
  local_path: vendor/skills/pwn-hunter
  commit: 403310598eab3c99c24082795c35b76e790ed6a5
  upstream_modified: false
  provenance: vendor/PROVENANCE.md and vendor/sources.lock.json
  strengths: Primitive-driven loop (crash, RIP, leak, write, exec) with concrete triage commands; covers stack, format string, heap, seccomp and kernel paths; demands measured offsets and a working exp.py instead of prose.
  weaknesses: Needs pwntools and a debugger; technique text assumes amd64/glibc or Linux kernel labs; no built-in target acquisition or reporting, so T4 owns engagement context and evidence.
  integration: T4 delegates binary work to this skill and records the primitive, offset and observed result as evidence.
